<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>店家後台管理 - 校園快閃咖啡館</title>
    <style>
        /* 確保框框計算包含 padding，防止溢出 */
        * { box-sizing: border-box; }
        
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
        }

        header { 
            background-color: #2c3e50; 
            color: white; 
            padding: 15px 25px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        /* 訂單列表網格佈局 (題目 a) */
        .order-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
        }

        /* 訂單卡片樣式 */
        .order-card { 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            border-top: 5px solid #6f4e37; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        .order-header { 
            padding: 12px 15px; 
            background: #f8f9fa; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: space-between; 
        }

        .order-body { 
            padding: 15px; 
            flex-grow: 1; 
        }

        .item-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 5px 0; 
            border-bottom: 1px dashed #eee; 
            font-size: 0.9rem; 
        }

        .total-price {
            text-align: right;
            margin-top: 10px;
            font-weight: bold;
            color: #e76f51;
            font-size: 1.1rem;
        }

        /* 智能狀態管理腳部 (題目 c) */
        .status-footer { 
            padding: 15px; 
            background: #fafafa; 
            display: flex; 
            gap: 10px; 
        }

        .btn { 
            flex: 1; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            color: white; 
            transition: 0.3s; 
        }

        .btn-process { background-color: #f39c12; }
        .btn-done { background-color: #27ae60; }
        
        .refresh-tag {
            font-size: 0.8rem;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div><strong>🛠 店家後台管理</strong> | 快閃咖啡館</div>
        <div class="refresh-tag">● 即時更新中 (每 30 秒自動刷新)</div>
    </header>

    <div class="order-grid" id="admin-order-list">
        </div>

    <script>
        // 必須與點餐頁面使用的名稱完全一致
        const STORAGE_KEY = 'coffee_orders_team130';

        // 即時更新：每 30 秒自動刷新 (題目 d)
        setInterval(() => { 
            console.log("自動同步訂單...");
            renderOrders(); 
        }, 30000);

        // 渲染訂單與詳情 (題目 a, b)
        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const container = document.getElementById('admin-order-list');
            
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#999; padding:50px;">目前尚無新訂單</p>';
                return;
            }

            // 依照下單順序排列 (題目要求)
            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span style="font-weight:bold;">#${order.id}</span>
                        <span style="font-size:0.8rem; color:#666;">${order.time}</span>
                    </div>
                    <div class="order-body">
                        <div style="margin-bottom:10px;">👤 <strong>${order.customer || '訪客'}</strong></div>
                        <div style="font-size:0.85rem; color:#666; margin-bottom:10px;">📞 ${order.phone || '未提供'}</div>
                        <div style="border-top:1px solid #eee; padding-top:10px;">
                            ${order.items.map(i => `
                                <div class="item-row">
                                    <span>${i.name}</span>
                                    <span>x1</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="total-price">總計: NT$ ${order.total}</div>
                    </div>
                    <div class="status-footer">
                        <button class="btn btn-process" onclick="updateStatus(this)">開始製作</button>
                        <button class="btn btn-done" onclick="finishOrder(${order.id})">已完成</button>
                    </div>
                </div>
            `).join('');
        }

        // 智能狀態切換邏輯
        function updateStatus(btn) {
            if (btn.innerText === "開始製作") {
                btn.innerText = "製作中";
                btn.style.backgroundColor = "#d35400"; // 顏色轉深橘代表正在製作
            }
        }

        // 完成訂單並移除
        function finishOrder(id) {
            if (confirm('確認訂單已準備好取餐並從待處理清單移除？')) {
                let orders = JSON.parse(localStorage.getItem(STORAGE_KEY));
                // 過濾掉已完成的單號
                orders = orders.filter(o => o.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
                renderOrders(); // 立即重新渲染畫面
            }
        }

        // 初始化頁面
        window.onload = renderOrders;
    </script>
</body>
</html>
